name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  linux:
    name: AppImage (linux x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/install-deps-ubuntu.sh
      - run: ./packaging/appimage/build.sh
      - run: ./packaging/appimage/build.sh --cli
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            packaging/appimage/*.AppImage*

  windows:
    name: Velopack installer (windows x86_64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        shell: pwsh
        run: ./scripts/install-deps-windows.ps1
      - name: Velopack installer
        shell: pwsh
        run: ./packaging/windows/build-velopack.ps1
      - name: Command line zip
        shell: pwsh
        run: ./packaging/windows/build-cli-zip.ps1
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: packaging/windows/releases/*
