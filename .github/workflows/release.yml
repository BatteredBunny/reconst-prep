name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  linux:
    name: AppImage (linux x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev
      - run: ./scripts/prepare-gyroflow-checkout.sh
      - run: cargo build --locked --release -p reconst-prep
      - run: ./packaging/appimage/build.sh
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            packaging/appimage/*.AppImage*

  windows:
    name: Velopack installer (windows x86_64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Remove gyroflow-core profile-DB download
        shell: bash
        run: ./scripts/prepare-gyroflow-checkout.sh
      - run: cargo build --locked --release -p reconst-prep
      - name: Velopack installer
        shell: pwsh
        run: ./packaging/windows/build-velopack.ps1
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: packaging/windows/releases/*
