[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/BatteredBunny/reconst-prep"

[workspace.dependencies]
gyroflow-core = { git = "https://github.com/BatteredBunny/gyroflow.git", rev = "f6cd36bfd1a0cd0152c8b87cd5eead2a232824e1", default-features = false }

ffmpeg-sidecar = { version = "2.7.0", default-features = false }
fast_image_resize = "6.1.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
etcetera = "0.11.0"
tempfile = "3.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
crossbeam-channel = "0.5.17"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
anyhow = "1.0.104"
thiserror = "2.0.21"
# Pin Blitz: native events, mounted geometry and custom raster widgets are newer than 0.7.10.
dioxus = { version = "=0.8.0-alpha.3", default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-native = { git = "https://github.com/DioxusLabs/blitz", rev = "5be96ed0e621f1b52b71b2206a2c3a54e90c0b5c", default-features = false, features = ["vello-hybrid", "svg", "system-fonts", "accessibility"] }
blitz-shell = { git = "https://github.com/DioxusLabs/blitz", rev = "5be96ed0e621f1b52b71b2206a2c3a54e90c0b5c", default-features = false }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "5be96ed0e621f1b52b71b2206a2c3a54e90c0b5c", default-features = false }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "5be96ed0e621f1b52b71b2206a2c3a54e90c0b5c", default-features = false }
# Match Blitz's source identity to share renderer types; Cargo.lock pins the commit.
anyrender = { git = "https://github.com/DioxusLabs/anyrender", branch = "main" }
peniko = "0.6"
webbrowser = "1.2.6"
async-channel = "2.5.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time"] }
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
log = "0.4.34"
env_logger = { version = "0.11.11", default-features = false, features = ["humantime"] }
rustfft = "6.4.1"
ctrlc = "3.5.2"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
