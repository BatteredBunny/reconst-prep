<!-- The README's hero image: three whole windows cascading back to front, each on its own
     inspector tab. Units are the app's points: each shot in clean/ is the 1280x720 point window
     at twice that in pixels, placed here at 0.75. Each window steps right by more than the
     inspector column (312 points, 234 here), so every window's settings stay in view.
     Rendered by nix/screenshots.nix. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1540" height="980" viewBox="0 0 1540 980">
  <defs>
    <style>
      .frame { fill: none; stroke: #2a2d32; stroke-width: 1.5; }
      .name {
        font-family: Nordwand Mono; font-weight: 700; font-size: 64px;
        fill: #ffffff; stroke: #000000; stroke-width: 10px; stroke-linejoin: round;
        paint-order: stroke;
      }
    </style>
    <clipPath id="window">
      <rect width="960" height="540" rx="14"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- The name over the stack. -->
  <g transform="translate(770 82)">
    <image href="icon.svg" x="-290" y="-48" width="96" height="96"/>
    <text class="name" x="-176" y="22">reconst-prep</text>
  </g>

  <!-- Back: output size and format. -->
  <g transform="translate(540 400)" filter="url(#shadow)">
    <g clip-path="url(#window)">
      <image href="clean/output.png" width="960" height="540"/>
    </g>
    <rect class="frame" width="960" height="540" rx="14"/>
  </g>

  <!-- Middle: frame selection and the blur filter. -->
  <g transform="translate(290 280)" filter="url(#shadow)">
    <g clip-path="url(#window)">
      <image href="clean/selection.png" width="960" height="540"/>
    </g>
    <rect class="frame" width="960" height="540" rx="14"/>
  </g>

  <!-- Front: lens correction and masking, with a run in progress. -->
  <g transform="translate(40 160)" filter="url(#shadow)">
    <g clip-path="url(#window)">
      <image href="clean/processing.png" width="960" height="540"/>
    </g>
    <rect class="frame" width="960" height="540" rx="14"/>
  </g>
</svg>
